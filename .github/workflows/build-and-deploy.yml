name: Build and Deploy Jekyll Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # No ruby-version: setup-ruby reads site/.ruby-version (via working-directory),
          # so the local and CI versions can't drift apart.
          bundler-cache: true
          working-directory: site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check osteoporosis tool
        run: node site/osteoporosis-risk/logic-check.mjs

      - name: Check uninsured fee calculator
        run: node site/uninsured-fees/logic-check.cjs

      - name: Build site
        run: make build

      - name: Verify build output
        run: |
          test -f _site/index.html
          test -f _site/assets/main.css
          test -f _site/assets/site.css
          test -f _site/assets/pdfs/Counselling-Options.pdf
          test -f _site/404.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/favicon.ico
          test -f _site/favicon.svg
          test -f _site/apple-touch-icon.png
          test -f _site/assets/og-image.png

      - name: Verify internal PDF links
        run: |
          python3 - <<'PY'
          import html
          import re
          import sys
          from pathlib import Path
          from urllib.parse import unquote


          site = Path("_site")
          missing = []
          bases = ("/assets/pdfs/", "/med-info/assets/pdfs/")

          for html_file in site.rglob("*.html"):
              text = html_file.read_text(encoding="utf-8")
              for href in re.findall(r'href="([^"]+)"', text):
                  for base in bases:
                      if href.startswith(base):
                          rel = unquote(html.unescape(href[len(base):]))
                          target = site / "assets" / "pdfs" / rel
                          if not target.exists():
                              missing.append((str(html_file), href))
                          break

          if missing:
              print("Missing internal PDF targets:")
              for html, href in missing:
                  print(f"- {html}: {href}")
              sys.exit(1)

          print("Internal PDF links verified.")
          PY

      - name: Check rendered site on desktop and mobile
        run: |
          npm install --prefix /tmp/medlinks-ui --no-save playwright@1.64.1
          /tmp/medlinks-ui/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/medlinks-ui/node_modules node scripts/check-site-ui.cjs

      - name: Save UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-ui-review
          path: ui-checks/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

