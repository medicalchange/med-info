title: "MedicalLinks"
baseurl: ""
url: "https://medicallinks.ca"
description: "Clinical references, decision-support tools and patient handouts for primary care in Ontario."
timezone: America/New_York
markdown: kramdown
permalink: pretty
theme: minima
plugins:
  - jekyll-feed
collections:
  interesting_links:
    output: false

# Privacy-friendly analytics. Clear analytics_provider to disable tracking.
analytics_provider: umami
umami_website_id: "bdd27b7a-9049-4f05-b22f-1b2412a1d1cc"

# Authoring notes are not public site content.
exclude:
  - NEW_INTERESTING_LINK_TEMPLATE.md
  - cv-risk/README.md

