title: "MedicalLinks"
baseurl: ""
url: "https://medicallinks.ca"
description: "Clinical references, decision-support tools and patient handouts for primary care in Ontario."
timezone: America/New_York
markdown: kramdown
permalink: pretty
theme: minima
plugins:
  - jekyll-feed
collections:
  interesting_links:
    output: false

# Privacy-friendly analytics (optional): set goatcounter_site to enable.
analytics_provider: goatcounter
goatcounter_site: "ydafus"

# Authoring notes are not public site content.
exclude:
  - NEW_INTERESTING_LINK_TEMPLATE.md
  - cv-risk/README.md
