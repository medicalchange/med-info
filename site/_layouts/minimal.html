<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "Resources" }}</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v=20261026-4">
    {% if site.analytics_provider == "goatcounter" and site.goatcounter_site and site.goatcounter_site != "" %}
    <script
      data-goatcounter="https://{{ site.goatcounter_site }}.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"></script>
    {% endif %}
  </head>
  <body>
    {% include site-header.html %}
    <main id="main-content" class="shell" tabindex="-1">
      <header class="hero">
        <p class="eyebrow">MedicalLinks</p>
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
      </header>
      {{ content }}
    </main>
    {% include site-footer.html %}
  </body>
</html>
